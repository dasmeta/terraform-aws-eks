env: test
product: app

image:
  repository: mendhak/http-https-echo
  tag: 34

# enable linkerd for the pod
podAnnotations:
  linkerd.io/inject: enabled
  config.linkerd.io/proxy-cpu-request: 10m
  config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "5"

containerPort: 8080

service:
  enabled: true
  # type: ClusterIP

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 4
  targetCPUUtilizationPercentage: 99

pdb:
  enabled: true
  minAvailable: 2

readinessProbe:
  initialDelaySeconds: 5
  failureThreshold: 1
  httpGet:
    path: /health
    port: http
livenessProbe:
  initialDelaySeconds: 5
  failureThreshold: 3
  httpGet:
    path: /health
    port: http
resources:
  requests:
    cpu: 15m

externalSecretsApiVersion: external-secrets.io/v1 # IMPORTANT to upgrade external secret api version as new eks module bring new external secret operator
secrets:
  - AN_TEST_SECRET_ENV

setIngressClassByField: true
ingress:
  enabled: true
  class: alb
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  hosts:
    - host: http-echo-karpenter-secret.devops.dasmeta.com
      paths:
        - path: "/ping"
          backend:
            serviceName: http-echo
            servicePort: 80
## uncomment the following configs to have application provisioned in on-demand nodes
