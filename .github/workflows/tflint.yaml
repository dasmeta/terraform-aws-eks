name: Tflint
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tflint-check:
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        path:
          - ./
    steps:
      - uses: dasmeta/reusable-actions-workflows/tflint@DMVP-9688-fix-actions-add-trivy
        with:
          path: ${{ matrix.path }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
