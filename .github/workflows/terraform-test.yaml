name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-test:
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        path:
          - /

    steps:
      - uses: dasmeta/reusable-actions-workflows/terraform-test@4.3.0
        with:
          aws-region: ${{ secrets.AWS_REGION}}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          path: ${{ matrix.path }}
        continue-on-error: true

  no-local-paths:
    name: no local filesystem paths
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      # A local path is legitimate while testing unreleased changes, but must never merge: this module is
      # published, so an absolute path breaks every consumer and leaks a local environment.
      - run: ./scripts/check-no-local-paths.sh
